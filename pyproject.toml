[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toursearch"
version = "0.1.0"
description = "Сравнение поиска туров на нескольких онлайн-площадках (Tourvisor, Sletat и др.)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # Верхние границы — чтобы автообновление до новой МАЖОРНОЙ версии не сломало сборку
    # тихо (лок-файла нет). Поднимать осознанно после проверки.
    "pydantic>=2.6,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
# Подключаются в своих фазах миграции.
browser = ["playwright>=1.44,<2"]
web = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4", "python-multipart>=0.0.9,<1"]
# Опциональные для прод-инфры. Никогда не нужны на dev / в Docker по умолчанию.
redis = ["redis>=5,<6"]
otel = [
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
    "opentelemetry-exporter-otlp>=1.27,<2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # Starlette ≥0.39 шлёт StarletteDeprecationWarning, если starlette.testclient ходит
    # через httpx, а не httpx2. httpx2 — отдельный пакет, ставим его в dev, чтобы
    # тестовый клиент работал на новом транспорте без депрекейшна.
    "httpx2>=2.3",
    "pytest-cov>=5.0",
    # Пин по верхней границе осознанный: ruff расширяет набор правил по умолчанию
    # между минорами. Без потолка «зелёный линт» зависит от даты прогона, а не от кода —
    # на 0.16 незакреплённый ruff дал 548 нарушений на неизменившемся коде.
    "ruff>=0.5,<0.17",
]

[project.scripts]
toursearch = "toursearch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/toursearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not e2e'"
markers = [
    "e2e: живые тесты против реальных сайтов (запуск: pytest -m e2e)",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Набор объявлен явно, а не унаследован от дефолта ruff. Дефолт — движущаяся цель:
# он расширяется от версии к версии, и гейт начинает падать на коде, который никто
# не трогал. Здесь перечислено то, подо что код писался: ошибки синтаксиса и импортов
# (E4), операторы (E7), нерабочий код (E9) и весь pyflakes (F). Против этого набора
# src/ tests/ scripts/ дают ноль нарушений.
#
# Расширять набор можно и стоит (кандидат — "I", сортировка импортов, 43 авто-правки),
# но отдельным коммитом: правка стиля не должна ехать вместе с починкой CI.
select = ["E4", "E7", "E9", "F"]
