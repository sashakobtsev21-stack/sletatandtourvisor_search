[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toursearch"
version = "0.1.0"
description = "Сравнение поиска туров на нескольких онлайн-площадках (Tourvisor, Sletat и др.)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
# Подключаются в своих фазах миграции.
browser = ["playwright>=1.44"]
web = ["fastapi>=0.111", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
toursearch = "toursearch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/toursearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not e2e'"
markers = [
    "e2e: живые тесты против реальных сайтов (запуск: pytest -m e2e)",
]
