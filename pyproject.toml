[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toursearch"
version = "0.1.0"
description = "Сравнение поиска туров на нескольких онлайн-площадках (Tourvisor, Sletat и др.)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
# Подключаются в своих фазах миграции.
browser = ["playwright>=1.44"]
web = ["fastapi>=0.111", "uvicorn>=0.30", "jinja2>=3.1"]
db = ["sqlmodel>=0.0.16"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
toursearch = "toursearch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/toursearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
