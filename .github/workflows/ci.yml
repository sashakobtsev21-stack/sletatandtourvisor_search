name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser,web,dev]"
      - name: Lint (ruff)
        run: ruff check src/ tests/
      - name: Unit & integration tests (e2e excluded)
        run: pytest -q --cov=toursearch --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: ignore
