name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser,web,dev]"
          pip install pip-audit
      - name: Install Playwright Chromium
        # tests/test_parse_fixtures.py запускает реальный chromium.launch() для парсинга
        # HTML-фикстур — без браузера pytest красный.
        run: python -m playwright install --with-deps chromium
      - name: Lint (ruff)
        run: ruff check src/ tests/ scripts/
      - name: Security audit (pip-audit, non-blocking)
        # Информационный шаг, как и npm audit ниже: новая чужая advisory не должна
        # красить сборку на неизменившемся коде. Смотрим в логи и чиним обновлением
        # зависимостей отдельным коммитом.
        continue-on-error: true
        run: pip-audit --skip-editable
      - name: Unit & integration tests (e2e excluded)
        run: pytest -q --cov=toursearch --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install deps
        run: npm --prefix frontend ci
      - name: Security audit (npm audit, non-blocking)
        # Информационный шаг: новые чужие advisories не должны красить PR.
        # Смотрим в логи и чиним обновлением зависимостей отдельным коммитом.
        continue-on-error: true
        run: npm --prefix frontend audit --audit-level=high
      - name: Frontend unit tests (vitest)
        run: npm --prefix frontend test
