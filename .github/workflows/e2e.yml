name: E2E (nightly health-check)

# Ежедневный прогон живых проверок против реальных сайтов площадок.
# Цель — ловить «сайт-провайдер сломал форму» до пользователей: health-check
# дёргает якоря форм Sletat/Tourvisor; если они уехали — workflow красный.
#
# Запускается:
#   • по cron (раз в сутки, ночью UTC = утром МСК — до рабочего пика);
#   • вручную через "Run workflow" (workflow_dispatch).
#
# В основной CI (ci.yml) e2e НЕ включён сознательно: тест зависит от внешних
# сайтов и периодически флачит по сетевым причинам, не должен валить PR.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser,web,dev]"
      - name: Install Playwright browser (Chromium)
        run: python -m playwright install --with-deps chromium
      - name: Health-check live providers
        run: pytest -m e2e -v --tb=short
      - name: Upload artifacts (screenshots, traces, junit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            screenshots/
            traces/
            runs/
            junit.xml
          if-no-files-found: ignore
